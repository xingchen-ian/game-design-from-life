<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Four-step design and development cycle</title>
  <desc>A life experience is abstracted into a data system, built in a game engine, then expanded into a full game experience</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="a-loop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <g class="node c-blue">
    <rect x="80" y="30" width="520" height="64" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <circle cx="110" cy="62" r="14" fill="#378ADD" stroke="none"/>
    <text x="110" y="67" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="500">1</text>
    <text x="138" y="52" dominant-baseline="central" fill="#042C53" font-family="Inter, sans-serif" font-size="14" font-weight="500">Life or learning experience</text>
    <text x="138" y="74" dominant-baseline="central" fill="#185FA5" font-family="Inter, sans-serif" font-size="12">emotional / conceptual prototype</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="340" y1="94" x2="340" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="356" y="100" width="200" height="18" rx="4" fill="none" stroke="none"/>
  <text x="456" y="113" text-anchor="end" dominant-baseline="central" fill="#888780" font-family="Inter, sans-serif" font-size="11">guided questioning &amp; analysis</text>

  <!-- Step 2 -->
  <g class="node c-teal">
    <rect x="80" y="130" width="520" height="64" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <circle cx="110" cy="162" r="14" fill="#1D9E75" stroke="none"/>
    <text x="110" y="167" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="500">2</text>
    <text x="138" y="152" dominant-baseline="central" fill="#04342C" font-family="Inter, sans-serif" font-size="14" font-weight="500">Data-abstracted system</text>
    <text x="138" y="174" dominant-baseline="central" fill="#0F6E56" font-family="Inter, sans-serif" font-size="12">action / process / space / data</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="340" y1="194" x2="340" y2="224" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="456" y="213" text-anchor="end" dominant-baseline="central" fill="#888780" font-family="Inter, sans-serif" font-size="11">programming &amp; construction</text>

  <!-- Step 3 -->
  <g class="node c-purple">
    <rect x="80" y="230" width="520" height="64" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <circle cx="110" cy="262" r="14" fill="#7F77DD" stroke="none"/>
    <text x="110" y="267" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="500">3</text>
    <text x="138" y="252" dominant-baseline="central" fill="#26215C" font-family="Inter, sans-serif" font-size="14" font-weight="500">System built in game engine</text>
    <text x="138" y="274" dominant-baseline="central" fill="#534AB7" font-family="Inter, sans-serif" font-size="12">C# implementation of core mechanics</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="340" y1="294" x2="340" y2="324" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="456" y="313" text-anchor="end" dominant-baseline="central" fill="#888780" font-family="Inter, sans-serif" font-size="11">expansion</text>

  <!-- Step 4 -->
  <g class="node c-coral">
    <rect x="80" y="330" width="520" height="64" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
    <circle cx="110" cy="362" r="14" fill="#D85A30" stroke="none"/>
    <text x="110" y="367" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Inter, sans-serif" font-size="13" font-weight="500">4</text>
    <text x="138" y="352" dominant-baseline="central" fill="#4A1B0C" font-family="Inter, sans-serif" font-size="14" font-weight="500">Game experience and world expansion</text>
    <text x="138" y="374" dominant-baseline="central" fill="#993C1D" font-family="Inter, sans-serif" font-size="12">playable build, user testing, iteration</text>
  </g>

  <!-- Return loop arrow (right side, curved) -->
  <path d="M 600 362 Q 650 362 650 196 Q 650 30 600 30" fill="none" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#a-loop)"/>
  <text x="658" y="200" dominant-baseline="central" fill="#888780" font-family="Inter, sans-serif" font-size="10.5" transform="rotate(90, 658, 200)">iterate from player feedback</text>
</svg>