  <h1 class="sr-only">过程工具</h1>

  <div class="workspace" id="workspace">
    <section class="pane" id="paneAsk" aria-labelledby="askTitle">
      <h2 class="pane-head" id="askTitle"><span>问题</span></h2>
      <div class="pane-body">
        <p class="pane-lead">先答下面这些。确认一题，中间的图就更新，不用等 21 题答完。后补的题先不排进来。点到对应的节点，再出现。</p>
        <div class="pane-actions">
          <button type="button" class="btn btn-outline btn-tiny" id="loadSail">载入帆船例子</button>
          <button type="button" class="btn btn-outline btn-tiny" id="clearAll">清空</button>
        </div>
        <p class="pane-lead">帆船只是一组写好的 Q1–Q4，用来和过程页对照。你可以从空白开始，写别的事。</p>
        <h3 class="ask-label">先答</h3>
        <div id="askCore"></div>
        <h3 class="ask-label">后补</h3>
        <p class="pane-lead" id="followHint">开头不排队。点中间的节点，相关的后补题会出现在这里。</p>
        <div id="askFollow"></div>
      </div>
    </section>

    <div class="divider" id="split0" data-split="0" role="separator" aria-orientation="vertical" aria-label="调整问题栏和系统图的宽度" tabindex="0" title="拖动调整宽度，双击恢复"></div>

    <section class="pane" id="paneGraph" aria-labelledby="graphTitle">
      <h2 class="pane-head" id="graphTitle"><span>系统图</span></h2>
      <div class="pane-body" id="graphBody">
        <p class="graph-status" id="graphStatus">还没有图。</p>
        <div id="graphMount"></div>
      </div>
      <div class="editor-dock">
        <p class="editor-kicker" id="selectedType">还没选节点</p>
        <h2 id="selectedName">点一个节点可以改字</h2>
        <p class="fine" id="selectedOwn"></p>
        <div id="editorFields" hidden>
          <label class="sr-only" for="directEdit">节点内容</label>
          <textarea id="directEdit" placeholder="写下这个节点现在的内容。留空，空位就还在。"></textarea>
          <div class="dock-actions">
            <button type="button" class="btn btn-outline btn-tiny" id="applyDirect">写入图</button>
            <button type="button" class="btn btn-outline btn-tiny" id="askAi" title="按已写答案在本地收成一句，不是模型">让 AI 提议</button>
            <button type="button" class="btn btn-outline btn-tiny" id="applyAi" hidden>把提议写入图</button>
          </div>
          <p id="aiLine" hidden></p>
        </div>
        <p class="fine" id="editHint" role="status"></p>
        <div class="make-row">
          <button type="button" class="btn btn-primary" id="makeGame">生成游戏</button>
          <p class="fine" id="confirmFine">Confirm。不检查 21 题、最低可玩或四句话。空节点留着，这一版不做。</p>
        </div>
      </div>
    </section>

    <div class="divider" id="split1" data-split="1" role="separator" aria-orientation="vertical" aria-label="调整系统图和 Game 的宽度" tabindex="0" title="拖动调整宽度，双击恢复"></div>

    <section class="pane" id="paneGame" aria-labelledby="gameTitle">
      <h2 class="pane-head" id="gameTitle"><span>Game</span></h2>
      <div class="pane-body" id="gameBody"></div>
    </section>
  </div>

  <script src="assets/main.js"></script>
  <script src="assets/process-app.js"></script>
